<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID 生成器 - Antii Tools</title>
  <meta name="description" content="免费的浏览器端 UUID v4 生成器，支持批量生成、复制和下载。">
  <link rel="canonical" href="https://antii-tools.vercel.app/uuid-generator/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="glow-bg-container">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo logo-link">
        <i class="fa-solid fa-screwdriver-wrench icon-gradient"></i>
        <span class="logo-text">Antii<span class="highlight">Tools</span></span>
      </a>
      <div class="nav-links">
        <a href="../index.html#tools" class="nav-link">全部工具</a>
        <a href="../json-formatter/index.html" class="nav-link">JSON</a>
        <a href="../timestamp-converter/index.html" class="nav-link">时间戳</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="tool-shell">
      <header class="tool-hero">
        <span class="eyebrow"><i class="fa-solid fa-fingerprint"></i> UUID Tool</span>
        <h1>UUID v4 生成器</h1>
        <p>在浏览器中生成随机 UUID，适合测试数据、临时标识、前端 mock 和开发调试。</p>
      </header>

      <section class="tool-workbench single">
        <div class="tool-panel">
          <div class="tool-panel-header">
            <h2>生成设置</h2>
            <span class="tool-status success" id="uuid-status">就绪</span>
          </div>
          <div class="form-grid compact">
            <label>
              <span>数量</span>
              <input id="uuid-count" class="tool-input" type="number" min="1" max="100" value="5">
            </label>
            <label>
              <span>格式</span>
              <select id="uuid-format" class="tool-input">
                <option value="standard">标准小写</option>
                <option value="uppercase">大写</option>
                <option value="no-hyphen">无连字符</option>
              </select>
            </label>
          </div>
          <textarea id="uuid-output" class="tool-textarea short" spellcheck="false" readonly></textarea>
        </div>
      </section>

      <section class="tool-actions-bar">
        <button class="tool-btn primary" id="btn-generate"><i class="fa-solid fa-rotate"></i> 生成</button>
        <button class="tool-btn" id="btn-copy"><i class="fa-solid fa-copy"></i> 复制</button>
        <button class="tool-btn" id="btn-download"><i class="fa-solid fa-download"></i> 下载 TXT</button>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-links">
        <a href="../about.html">关于我们</a>
        <a href="../privacy.html">隐私政策</a>
        <a href="../terms.html">服务条款</a>
        <a href="../contact.html">联系我们</a>
      </div>
      <p>&copy; 2026 Antii Tools.</p>
    </div>
  </footer>
</body>
</html>
