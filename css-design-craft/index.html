  <!-- 主体内容 -->
  <main class="main-content">
    <div class="container">
      <header class="page-header">
        <h1>CSS 样式视觉神匠</h1>
        <p>直观、现代的前端样式生成利器。支持毛玻璃、高级投影与炫彩渐变调试，一键复制 CSS 代码。</p>
      </header>

      <!-- 选项卡切换 -->
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="glass">
          <i class="fa-solid fa-cubes"></i> 毛玻璃效果
        </button>
        <button class="tab-btn" data-tab="shadow">
          <i class="fa-solid fa-circle-half-stroke"></i> 盒子阴影
        </button>
        <button class="tab-btn" data-tab="gradient">
          <i class="fa-solid fa-palette"></i> 炫彩渐变
        </button>
      </div>

      <div class="grid-layout">
        
        <!-- 左侧：参数控制面板 -->
        <section class="controls-column">
          
          <!-- 1. 毛玻璃控制项 -->
          <div class="control-card card active" id="controls-glass">
            <div class="card-header">
              <i class="fa-solid fa-sliders header-icon"></i>
              <h2>毛玻璃参数</h2>
            </div>

            <!-- 背景模糊 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="glass-blur">模糊程度 (Blur)</label>
                <span id="glass-blur-val">10px</span>
              </div>
              <input type="range" id="glass-blur" min="0" max="40" value="10" step="1">
            </div>

            <!-- 背景不透明度 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="glass-opacity">背景透明度 (Opacity)</label>
                <span id="glass-opacity-val">20%</span>
              </div>
              <input type="range" id="glass-opacity" min="0" max="100" value="20" step="1">
            </div>

            <!-- 背景颜色 -->
            <div class="control-group">
              <label for="glass-color" class="field-label">玻璃底色</label>
              <div class="color-picker-row">
                <div class="color-input-container">
                  <input type="color" id="glass-color" value="#ffffff">
                  <input type="text" id="glass-color-hex" value="#FFFFFF">
                </div>
              </div>
            </div>

            <!-- 边框不透明度 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="glass-border-opacity">边框透明度 (Border Opacity)</label>
                <span id="glass-border-opacity-val">10%</span>
              </div>
              <input type="range" id="glass-border-opacity" min="0" max="100" value="10" step="1">
            </div>

            <!-- 圆角半径 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="glass-radius">圆角大小 (Radius)</label>
                <span id="glass-radius-val">16px</span>
              </div>
              <input type="range" id="glass-radius" min="0" max="50" value="16" step="1">
            </div>

            <!-- 背景图片预设 -->
            <div class="control-group">
              <label class="field-label">底图预览预设</label>
              <div class="preset-grid" id="glass-bg-presets">
                <button class="preset-btn active" data-bg="gradient" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);"></button>
                <button class="preset-btn" data-bg="image1" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=150&auto=format&fit=crop&q=60'); background-size: cover;"></button>
                <button class="preset-btn" data-bg="image2" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=60'); background-size: cover;"></button>
                <button class="preset-btn" data-bg="dark" style="background: #111726;"></button>
              </div>
            </div>
          </div>

          <!-- 2. 阴影控制项 -->
          <div class="control-card card" id="controls-shadow">
            <div class="card-header">
              <i class="fa-solid fa-sliders header-icon"></i>
              <h2>阴影参数</h2>
            </div>

            <!-- 偏移 X -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="shadow-x">水平偏移 (Offset X)</label>
                <span id="shadow-x-val">0px</span>
              </div>
              <input type="range" id="shadow-x" min="-50" max="50" value="0" step="1">
            </div>

            <!-- 偏移 Y -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="shadow-y">垂直偏移 (Offset Y)</label>
                <span id="shadow-y-val">15px</span>
              </div>
              <input type="range" id="shadow-y" min="-50" max="50" value="15" step="1">
            </div>

            <!-- 模糊半径 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="shadow-blur">模糊半径 (Blur)</label>
                <span id="shadow-blur-val">30px</span>
              </div>
              <input type="range" id="shadow-blur" min="0" max="100" value="30" step="1">
            </div>

            <!-- 扩散半径 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="shadow-spread">扩张半径 (Spread)</label>
                <span id="shadow-spread-val">0px</span>
              </div>
              <input type="range" id="shadow-spread" min="-30" max="50" value="0" step="1">
            </div>

            <!-- 阴影颜色 -->
            <div class="control-group">
              <label for="shadow-color" class="field-label">阴影色彩</label>
              <div class="color-picker-row">
                <div class="color-input-container">
                  <input type="color" id="shadow-color" value="#000000">
                  <input type="text" id="shadow-color-hex" value="#000000">
                </div>
              </div>
            </div>

            <!-- 阴影不透明度 -->
            <div class="slider-group">
              <div class="slider-header">
                <label for="shadow-opacity">阴影透明度 (Opacity)</label>
                <span id="shadow-opacity-val">30%</span>
              </div>
              <input type="range" id="shadow-opacity" min="0" max="100" value="30" step="1">
            </div>

            <!-- 内/外阴影 -->
            <div class="control-group">
              <label for="shadow-inset" class="field-label">阴影类型</label>
              <select id="shadow-inset">
                <option value="false">外阴影 (Outset)</option>
                <option value="true">内阴影 (Inset)</option>
              </select>
            </div>
          </div>

          <!-- 3. 渐变控制项 -->
          <div class="control-card card" id="controls-gradient">
            <div class="card-header">
              <i class="fa-solid fa-sliders header-icon"></i>
              <h2>渐变参数</h2>
            </div>

            <!-- 渐变类型 -->
            <div class="control-group">
              <label for="grad-type" class="field-label">渐变类型</label>
              <select id="grad-type">
                <option value="linear">线性渐变 (Linear)</option>
                <option value="radial">径向渐变 (Radial)</option>
              </select>
            </div>

            <!-- 线性渐变角度 -->
            <div class="slider-group" id="grad-angle-group">
              <div class="slider-header">
                <label for="grad-angle">渐变角度 (Angle)</label>
                <span id="grad-angle-val">135°</span>
              </div>
              <input type="range" id="grad-angle" min="0" max="360" value="135" step="5">
            </div>

            <!-- 颜色 1 -->
            <div class="color-stop-row">
              <div class="color-field">
                <label>起点颜色 1</label>
                <div class="color-input-container">
                  <input type="color" id="grad-color-1" value="#6366f1">
                  <input type="text" id="grad-color-1-hex" value="#6366F1">
                </div>
              </div>
              <div class="slider-group stop-slider">
                <div class="slider-header">
                  <label for="grad-stop-1">位置 1</label>
                  <span id="grad-stop-1-val">0%</span>
                </div>
                <input type="range" id="grad-stop-1" min="0" max="100" value="0" step="1">
              </div>
            </div>

            <!-- 颜色 2 -->
            <div class="color-stop-row">
              <div class="color-field">
                <label>终点颜色 2</label>
                <div class="color-input-container">
                  <input type="color" id="grad-color-2" value="#a855f7">
                  <input type="text" id="grad-color-2-hex" value="#A855F7">
                </div>
              </div>
              <div class="slider-group stop-slider">
                <div class="slider-header">
                  <label for="grad-stop-2">位置 2</label>
                  <span id="grad-stop-2-val">100%</span>
                </div>
                <input type="range" id="grad-stop-2" min="0" max="100" value="100" step="1">
              </div>
            </div>
          </div>
        </section>

        <!-- 右侧：实时预览与 CSS 导出 -->
        <section class="preview-column">
          <div class="preview-card card">
            <div class="card-header">
              <i class="fa-solid fa-eye header-icon"></i>
              <h2>效果预览</h2>
            </div>
            
            <!-- 视觉效果画布 -->
            <div class="visual-canvas" id="visual-canvas">
              <div class="preview-target" id="preview-target">
                <span class="target-label" id="target-label">CSS Card</span>
              </div>
            </div>

            <!-- CSS 代码输出 -->
            <div class="css-output-box">
              <div class="output-header">
                <span><i class="fa-solid fa-terminal"></i> CSS 代码</span>
                <button id="btn-copy-css" class="btn-copy"><i class="fa-solid fa-copy"></i> 复制代码</button>
              </div>
              <div class="code-container">
                <pre><code id="code-content"></code></pre>
              </div>
            </div>
          </div>

          <!-- 侧边广告位 (300x250) -->

              <script>

            </div>
          </div>
        </section>

  <!-- 登录弹窗 (Login Modal) -->
  <div class="modal hidden" id="login-modal">
    <div class="modal-backdrop" id="login-backdrop" onclick="hideLoginModal()"></div>
    <div class="modal-wrapper login-wrapper" style="max-width: 400px; background: #1f2937; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden;">
      <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.08); padding: 1.2rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: #f3f4f6;"><i class="fa-solid fa-user-lock" style="color: #6366f1;"></i> 登录 / 注册</h3>
        <button onclick="hideLoginModal()" class="modal-close-btn" style="background: none; border: none; color: #9ca3af; font-size: 1.8rem; cursor: pointer; line-height: 1;">&times;</button>
      </div>
      <div class="modal-body login-body" style="display: flex; flex-direction: column; gap: 15px; padding: 25px; text-align: left;">
        <p style="color: #9ca3af; font-size: 0.85rem; line-height: 1.5; text-align: center; margin-bottom: 5px;">登录后可跨端同步您的专业版 (Pro) 订阅状态，保存配置。</p>
        
        <!-- 邮箱/密码表单 -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <input type="email" id="login-email" placeholder="电子邮箱 (Email)" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #f3f4f6; outline: none; font-size: 0.9rem;">
          <input type="password" id="login-password" placeholder="密码 (Password)" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #f3f4f6; outline: none; font-size: 0.9rem;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">
          <button onclick="loginWithEmail()" class="btn" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; text-align: center;">登录</button>
          <button onclick="registerWithEmail()" class="btn btn-outline" style="background: rgba(255,255,255,0.03); color: #f3f4f6; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-align: center;">注册账号</button>
        </div>

        <!-- 分割线 -->
        <div style="display: flex; align-items: center; text-align: center; color: #6b7280; font-size: 0.75rem; margin: 5px 0;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.08);"></div>
          <span style="padding: 0 10px;">或</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.08);"></div>
        </div>

        <!-- 谷歌登录 -->
        <button onclick="loginWithGoogle()" class="btn btn-google-login" style="background: white; color: #1f2937; border: 1px solid #d1d5db; padding: 10px; border-radius: 6px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; width: 100%;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="google" style="width: 16px; height: 16px;">
          使用 Google 账号登录
        </button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../auth.js"></script>
  
  <!-- 业务逻辑 JS -->
  <script src="app.js"></script>
</body>
