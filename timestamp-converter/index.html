<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间戳转换器 - Antii Tools</title>
  <meta name="description" content="免费的时间戳转换工具，支持 Unix 秒、毫秒、ISO 时间、本地时间与 UTC 时间互转。">
  <link rel="canonical" href="https://antii-tools.vercel.app/timestamp-converter/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="glow-bg-container">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo logo-link">
        <i class="fa-solid fa-screwdriver-wrench icon-gradient"></i>
        <span class="logo-text">Antii<span class="highlight">Tools</span></span>
      </a>
      <div class="nav-links">
        <a href="../index.html#tools" class="nav-link">全部工具</a>
        <a href="../json-formatter/index.html" class="nav-link">JSON</a>
        <a href="../uuid-generator/index.html" class="nav-link">UUID</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="tool-shell">
      <header class="tool-hero">
        <span class="eyebrow"><i class="fa-solid fa-clock"></i> Time Tool</span>
        <h1>时间戳转换器</h1>
        <p>把 Unix 时间戳、毫秒时间戳、ISO 字符串和本地时间快速互转，调接口和查日志时少一点心算。</p>
      </header>

      <section class="tool-workbench single">
        <div class="tool-panel">
          <div class="tool-panel-header">
            <h2>输入时间</h2>
            <button class="tool-btn ghost" id="btn-now"><i class="fa-solid fa-bolt"></i> 使用当前时间</button>
          </div>
          <div class="form-grid">
            <label>
              <span>Unix 秒</span>
              <input id="unix-seconds" class="tool-input" inputmode="numeric" placeholder="1717776000">
            </label>
            <label>
              <span>Unix 毫秒</span>
              <input id="unix-ms" class="tool-input" inputmode="numeric" placeholder="1717776000000">
            </label>
            <label>
              <span>ISO 时间</span>
              <input id="iso-time" class="tool-input" placeholder="2026-06-07T12:00:00.000Z">
            </label>
            <label>
              <span>本地日期时间</span>
              <input id="local-time" class="tool-input" type="datetime-local">
            </label>
          </div>
          <p class="tool-status" id="time-status">修改任意字段即可转换</p>
        </div>
      </section>

      <section class="tool-output-grid">
        <div class="stat-tile">
          <span>本地显示</span>
          <strong id="local-readable">-</strong>
        </div>
        <div class="stat-tile">
          <span>UTC 显示</span>
          <strong id="utc-readable">-</strong>
        </div>
        <div class="stat-tile">
          <span>时区</span>
          <strong id="timezone-readable">-</strong>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-links">
        <a href="../about.html">关于我们</a>
        <a href="../privacy.html">隐私政策</a>
        <a href="../terms.html">服务条款</a>
        <a href="../contact.html">联系我们</a>
      </div>
      <p>&copy; 2026 Antii Tools.</p>
    </div>
  </footer>
</body>
</html>
